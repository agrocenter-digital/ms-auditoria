spring.application.name=ms-auditoria
server.port=${SERVER_PORT:8086}
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_auditoria}}
spring.datasource.username=${DB_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
aws.region=${AWS_REGION:us-east-1}
agrocenter.auditoria.kinesis.enabled=${KINESIS_CONSUMER_ENABLED:false}
agrocenter.auditoria.kinesis.business-stream=${KINESIS_COMMERCIAL_STREAM:agrocenter-kinesis-negocio}
agrocenter.auditoria.kinesis.stock-stream=${KINESIS_INVENTORY_STREAM:agrocenter-kinesis-stock}
agrocenter.auditoria.kinesis.business-application=${KINESIS_BUSINESS_APPLICATION:agrocenter-auditoria-negocio}
agrocenter.auditoria.kinesis.stock-application=${KINESIS_STOCK_APPLICATION:agrocenter-auditoria-stock}
agrocenter.auditoria.kinesis.retry-delay-ms=${KINESIS_RETRY_DELAY_MS:5000}
agrocenter.auditoria.resolucion.enabled=${AUDIT_RESOLUTION_ENABLED:false}
agrocenter.auditoria.kinesis.max-lag-ms=${KINESIS_MAX_LAG_MS:3600000}
agrocenter.auditoria.kinesis.max-silence-ms=${KINESIS_MAX_SILENCE_MS:120000}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
