# Las migraciones se ejecutan con un rol distinto del usuario de la aplicación.
# Deben pertenecer a la misma base y esquema que spring.datasource.
spring.flyway.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_auditoria}}
spring.flyway.user=${MIGRATION_DB_USERNAME}
spring.flyway.password=${MIGRATION_DB_PASSWORD}
