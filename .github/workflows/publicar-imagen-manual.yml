name: Publicar imagen ms-auditoria (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KINESIS_CONSUMER_ENABLED: "false"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Pruebas disponibles sin PostgreSQL externo
        run: mvn -B test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Construir y publicar imagen con identificador de commit
        id: imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/agrocenter-ms-auditoria:sha-${{ github.sha }}
      - name: Registrar digest para despliegue coordinado
        env:
          IMAGE_DIGEST: ${{ steps.imagen.outputs.digest }}
        run: |
          printf 'Digest de imagen para registrar: %s\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
